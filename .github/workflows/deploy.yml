name: Deploy HabitApp to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: habit-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure restricted SSH key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger server deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            deploy-habit-app

      - name: Verify HabitApp
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error \
              --max-time 10 https://habit.brycelivesey.com/ >/dev/null; then
              exit 0
            fi
            sleep 4
          done
          exit 1
